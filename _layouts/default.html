<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {% endif %}Suma Acharya</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;0,7..72,800;1,7..72,400;1,7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%23b5653f'/><text x='50' y='68' font-family='Georgia' font-weight='700' font-size='52' fill='%23fbf7f0' text-anchor='middle'>S</text></svg>">
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="{{ '/' | relative_url }}">Suma Acharya</a>
    <nav class="links">
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/#blog' | relative_url }}">Tech Blog</a>
      <a href="{{ '/#whimsicature' | relative_url }}">Whimsicature</a>
      <a class="talk" href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="footer">
  <div class="wrap foot-in">
    <p class="foot-small">© {{ 'now' | date: '%Y' }} Suma Acharya</p>
  </div>
</footer>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img alt=""><p></p></div>
<script>
  const lb = document.getElementById('lightbox');
  document.querySelectorAll('.art').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    lb.querySelector('img').src = a.getAttribute('href');
    lb.querySelector('img').alt = a.dataset.title;
    lb.querySelector('p').textContent = a.dataset.title;
    lb.classList.add('open');
  }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
