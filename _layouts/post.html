---
layout: default
---
<article class="article wrap">
  <a class="back" href="{{ '/#blog' | relative_url }}">← back to the Tech Blog</a>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: '%d %B %Y' }} · {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read{% if page.tags.size > 0 %} · {{ page.tags | join: ', ' }}{% endif %}</p>
  <div class="body">
    {{ content }}
  </div>
</article>
